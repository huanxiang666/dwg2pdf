name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          go build -trimpath -ldflags "-s -w" \
            -o "dist/dwg2pdf${EXT}" ./cmd/dwg2pdf

      - name: Smoke test (linux only)
        if: matrix.goos == 'linux'
        run: |
          ./dist/dwg2pdf --version
          ./dist/dwg2pdf --check

      - name: Package
        run: |
          NAME="dwg2pdf-${GITHUB_REF_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "pkg/${NAME}"
          cp -r dist/* "pkg/${NAME}/"
          cp README.md LICENSE "pkg/${NAME}/" 2>/dev/null || true
          cd pkg
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r "${NAME}.zip" "${NAME}"
          else
            tar -czf "${NAME}.tar.gz" "${NAME}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            pkg/*.zip
            pkg/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets
        run: |
          mkdir -p assets
          find artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp {} assets/ \;
          ls -lh assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
