<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dwg2pdf — 图纸转 PDF</title>
<style>
  :root { --accent:#0e7490; --bg:#f5f7f8; --card:#fff; --line:#e2e8ec; --text:#1f2430; --muted:#67707a; --bad:#b42318; --ok:#067647; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.65 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--card); border-bottom:1px solid var(--line); padding:14px 22px; display:flex; align-items:center; gap:14px; }
  header h1 { font-size:18px; margin:0; }
  header .sub { color:var(--muted); font-size:12px; }
  header .spacer { flex:1; }
  header button { border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 14px; cursor:pointer; color:var(--muted); }
  header button:hover { color:var(--bad); border-color:var(--bad); }
  main { max-width:880px; margin:22px auto; padding:0 18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:16px; }
  .banner { border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:14px; }
  .banner.warn { background:#fff7e6; border:1px solid #f0d9a8; color:#8a5a00; }
  .banner.ok { background:#e8f7ef; border:1px solid #b7e2c8; color:var(--ok); }
  .drop { border:2px dashed #c4cfd6; border-radius:10px; padding:30px; text-align:center; color:var(--muted); cursor:pointer; transition:.15s; }
  .drop.over, .drop:hover { border-color:var(--accent); color:var(--accent); background:#eef7fa; }
  .files { margin-top:12px; display:flex; flex-direction:column; gap:6px; }
  .files div { background:#f1f5f7; border-radius:6px; padding:7px 10px; display:flex; justify-content:space-between; gap:10px; align-items:center; }
  .files button { border:0; background:none; color:var(--bad); cursor:pointer; }
  .row { display:flex; gap:16px; align-items:center; margin-top:16px; flex-wrap:wrap; }
  label.chk { display:flex; gap:7px; align-items:center; color:var(--text); }
  select { padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  .go { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:11px 28px; font-size:15px; cursor:pointer; }
  .go:disabled { opacity:.5; cursor:not-allowed; }
  .out { margin-top:14px; white-space:pre-wrap; background:#0f172a; color:#d7e3f4; border-radius:8px; padding:12px; font:12px/1.7 ui-monospace,Consolas,monospace; max-height:300px; overflow:auto; }
  .out a { color:#7dd3fc; }
  .out.err { background:#4c1010; color:#ffd7d7; }
  .hint { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>dwg2pdf</h1>
  <span class="sub">DWG / DXF 图纸 → 矢量 PDF · 全部在本机处理</span>
  <span class="spacer"></span>
  <button id="quit">退出程序</button>
</header>
<main>
  <div class="card">
    <div class="banner" id="envBanner">正在检查转换环境…</div>
    <div class="drop" id="drop">把 .dwg / .dxf 图纸拖到这里，或点击选择文件<br>
      <span class="hint">可一次选多个；DWG 需要本机有转换器（见上方状态）</span></div>
    <input type="file" id="picker" multiple accept=".dwg,.dxf" hidden>
    <div class="files" id="fileList"></div>
    <div class="row">
      <label class="chk"><input type="checkbox" id="mono"> 黑白输出</label>
      <label class="chk">纸张
        <select id="paper">
          <option value="auto" selected>自动（按图纸内容）</option>
          <option value="a0">A0</option><option value="a1">A1</option>
          <option value="a2">A2</option><option value="a3">A3</option>
          <option value="a4">A4</option>
        </select>
      </label>
      <button class="go" id="run">开始转换</button>
      <span class="hint" id="status"></span>
    </div>
    <div class="out" id="out" hidden></div>
  </div>
  <div class="card">
    <div class="hint">
      说明：转换在本地完成，文件不会上传到任何服务器。大图纸（数十 MB 的 DXF）可能需要几十秒到几分钟，
      界面会显示每个文件的耗时；窗口保持打开即可，不要关闭本页面所在的服务进程。
      若 DWG 转换失败，通常是缺少转换器：安装 ODA File Converter（免费）后重启本程序即可自动识别。
    </div>
  </div>
</main>
<script>
let files = [];
const $ = id => document.getElementById(id);
const drop = $("drop"), picker = $("picker"), list = $("fileList"), out = $("out");

function renderFiles(){
  list.innerHTML = "";
  files.forEach((f,i)=>{
    const d = document.createElement("div");
    const s = document.createElement("span");
    s.textContent = f.name + "　(" + (f.size/1024/1024).toFixed(2) + " MB)";
    const x = document.createElement("button");
    x.textContent = "移除";
    x.onclick = ()=>{ files.splice(i,1); renderFiles(); };
    d.appendChild(s); d.appendChild(x); list.appendChild(d);
  });
}
drop.onclick = ()=>picker.click();
picker.onchange = e=>{ files.push(...e.target.files); renderFiles(); e.target.value=""; };
["dragover","dragenter"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over");}));
["dragleave","drop"].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove("over");}));
drop.addEventListener("drop",e=>{ files.push(...e.dataTransfer.files); renderFiles(); });

async function checkEnv(){
  try{
    const r = await fetch("/api/check");
    const j = await r.json();
    const b = $("envBanner");
    if(j.converters && j.converters.length){
      b.className = "banner ok";
      b.textContent = "DWG 转换器就绪：" + j.converters.join("；");
    }else{
      b.className = "banner warn";
      b.textContent = "未检测到 DWG 转换器：.dxf 可直接转换；.dwg 需安装 ODA File Converter（免费）或把 LibreDWG 的 dwg2dxf 放到程序目录。";
    }
  }catch(e){
    const b = $("envBanner");
    b.className = "banner warn";
    b.textContent = "环境检查失败：" + e;
  }
}
checkEnv();

$("run").onclick = async ()=>{
  if(!files.length){ alert("请先添加 .dwg 或 .dxf 文件"); return; }
  out.hidden = false; out.className = "out"; out.textContent = "转换中…大图纸可能需要几分钟，请耐心等待";
  $("run").disabled = true; $("status").textContent = "正在本机转换";
  const fd = new FormData();
  fd.append("monochrome", $("mono").checked ? "true" : "false");
  fd.append("paper", $("paper").value);
  files.forEach(f=>fd.append("files", f));
  try{
    const r = await fetch("/api/convert", {method:"POST", body:fd});
    const j = await r.json();
    let txt = "";
    (j.results||[]).forEach(x=>{
      txt += (x.err ? "✗ " : "✓ ") + x.name + (x.sec!=null ? "  (" + x.sec.toFixed(1) + "s)" : "") + (x.err ? "\n    " + x.err : "") + "\n";
    });
    if(j.download){
      txt += "\n下载结果：<a href='" + j.download + "' download='" + (j.filename||"result") + "'>" + (j.filename||"result") + "</a>";
    }
    out.innerHTML = txt || "完成";
    if((j.results||[]).some(x=>x.err)) out.className = "out err";
  }catch(e){
    out.className = "out err";
    out.textContent = "请求失败：" + e;
  }
  $("run").disabled = false; $("status").textContent = "";
};

$("quit").onclick = async ()=>{
  if(!confirm("确定退出 dwg2pdf 界面服务？")) return;
  try{ await fetch("/api/shutdown", {method:"POST"}); }catch(e){}
  document.body.innerHTML = "<div style='padding:60px;text-align:center;font-size:16px'>程序已退出，可以关闭本标签页。</div>";
};
</script>
</body>
</html>
