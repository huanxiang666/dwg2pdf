name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install DWG converter (Linux, enables real DWG integration tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libredwg-tools exists in some archives but not in every Ubuntu
          # release; fall back to a source build of the pinned release.
          sudo apt-get install -y libredwg-tools || {
            echo "::warning::libredwg-tools not in apt archive, building LibreDWG 0.14 from source"
            curl -fL --retry 3 -o /tmp/libredwg.tar.xz \
              https://github.com/LibreDWG/libredwg/releases/download/0.14/libredwg-0.14.tar.xz
            tar -xf /tmp/libredwg.tar.xz -C /tmp
            cd /tmp/libredwg-0.14
            ./configure --prefix="$HOME/.local" --disable-bindings --disable-shared CFLAGS="-O2 -w" > configure.log 2>&1 || { tail -20 configure.log; exit 1; }
            make -j"$(nproc)" > make.log 2>&1 || { tail -30 make.log; exit 1; }
            make install
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            "$HOME/.local/bin/dwg2dxf" --version
          }
          dwg2dxf --version || true

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q -rs

      - name: CLI smoke test
        run: |
          dwg2pdf --check
          dwg2pdf tests/data/sample.dxf -o smoke-out -j 1 --layout modelspace
          dwg2pdf --version
