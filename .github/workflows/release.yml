name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project + PyInstaller
        run: python -m pip install . pyinstaller

      - name: Build bundle
        run: pyinstaller packaging/dwg2pdf.spec --noconfirm

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          dist/dwg2pdf/dwg2pdf --version
          dist/dwg2pdf/dwg2pdf --check
          dist/dwg2pdf/dwg2pdf tests/data/sample.dxf -o /tmp/smoke -j 1 --layout modelspace
          test -s /tmp/smoke/sample.pdf
          head -c 5 /tmp/smoke/sample.pdf | grep -q "%PDF-"

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dist\dwg2pdf\dwg2pdf.exe --version
          dist\dwg2pdf\dwg2pdf.exe --check
          dist\dwg2pdf\dwg2pdf.exe tests\data\sample.dxf -o smoke-out -j 1 --layout modelspace
          if (-not (Test-Path smoke-out\sample.pdf)) { throw "smoke pdf missing" }
          $bytes = [System.IO.File]::ReadAllBytes("smoke-out\sample.pdf")[0..4]
          if ([System.Text.Encoding]::ASCII.GetString($bytes) -ne "%PDF-") { throw "not a pdf" }

      - name: Compute version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            V=$(python -c "import pathlib,re;print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/dwg2pdf/__init__.py').read_text()).group(1))")
            echo "version=${V}-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Package artifacts
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.version }}"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path dist/dwg2pdf -DestinationPath 'dwg2pdf-${VER}-${{ matrix.platform }}.zip'"
          else
            tar -czf "dwg2pdf-${VER}-${{ matrix.platform }}.tar.gz" -C dist dwg2pdf
          fi
          ls -la dwg2pdf-*

      - uses: actions/upload-artifact@v4
        with:
          name: dwg2pdf-${{ matrix.platform }}
          path: dwg2pdf-*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dwg2pdf-
          merge-multiple: true
          path: artifacts

      - name: List release files
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
